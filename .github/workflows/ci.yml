name: CI

on:
  push:
    branches:
      - main
      - release-*
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  GO_VERSION: '1.27.0'
  GOLANGCI_LINT_VERSION: 'v2.13.1'
  UP_VERSION: 'v0.38.4'
  PROVIDER_REPO: provider-litellm
  MODULE_PATH: github.com/corewire/provider-litellm
  GHCR_ORG: ghcr.io/corewire
  XPKG_REGISTRY_ORG: xpkg.upbound.io/corewire
  IMAGE_NAME: ghcr.io/corewire/provider-litellm

jobs:
  detect-noop:
    runs-on: ubuntu-24.04
    outputs:
      noop: ${{ steps.skip.outputs.should_skip }}
    steps:
      - name: Detect no-op changes
        id: skip
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          paths_ignore: '["**/*.md", "**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.gif"]'
          do_not_skip: '["workflow_dispatch", "push"]'

  lint:
    runs-on: ubuntu-24.04
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Find Go cache paths
        id: go-cache
        shell: bash
        run: |
          echo "gomodcache=$(go env GOMODCACHE)" >> "${GITHUB_OUTPUT}"
          echo "gocache=$(go env GOCACHE)" >> "${GITHUB_OUTPUT}"

      - name: Cache Go modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.go-cache.outputs.gomodcache }}
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: Cache Go build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.go-cache.outputs.gocache }}
          key: ${{ runner.os }}-go-build-lint-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-lint-

      - name: Cache Go tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/go/bin
            ~/.cache/golangci-lint
          key: ${{ runner.os }}-go-tools-${{ env.GOLANGCI_LINT_VERSION }}
          restore-keys: |
            ${{ runner.os }}-go-tools-

      - name: Vendor dependencies
        run: make vendor

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6 # v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          verify: false

  check-diff:
    runs-on: ubuntu-24.04
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Find Go cache paths
        id: go-cache
        shell: bash
        run: |
          echo "gomodcache=$(go env GOMODCACHE)" >> "${GITHUB_OUTPUT}"
          echo "gocache=$(go env GOCACHE)" >> "${GITHUB_OUTPUT}"

      - name: Cache Go modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.go-cache.outputs.gomodcache }}
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: Cache Go build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.go-cache.outputs.gocache }}
          key: ${{ runner.os }}-go-build-diff-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-diff-

      - name: Vendor dependencies
        run: make vendor

      - name: Check config/generated.lst freshness
        run: make generated-lst-check

      - name: Check generated code diff
        run: make generate && git diff --exit-code

  unit-tests:
    runs-on: ubuntu-24.04
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Find Go cache paths
        id: go-cache
        shell: bash
        run: |
          echo "gomodcache=$(go env GOMODCACHE)" >> "${GITHUB_OUTPUT}"
          echo "gocache=$(go env GOCACHE)" >> "${GITHUB_OUTPUT}"

      - name: Cache Go modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.go-cache.outputs.gomodcache }}
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: Cache Go build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.go-cache.outputs.gocache }}
          key: ${{ runner.os }}-go-build-test-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-test-

      - name: Vendor dependencies
        run: make vendor

      - name: Run unit tests
        run: make -j2 test

  build-publish-artifacts:
    runs-on: ubuntu-24.04
    needs:
      - detect-noop
      - lint
      - check-diff
      - unit-tests
    if: needs.detect-noop.outputs.noop != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Install Upbound CLI
        shell: bash
        run: |
          curl -sL https://cli.upbound.io | sh
          echo "${HOME}/.up/bin" >> "${GITHUB_PATH}"

      - name: Find Go cache paths
        id: go-cache
        shell: bash
        run: |
          echo "gomodcache=$(go env GOMODCACHE)" >> "${GITHUB_OUTPUT}"
          echo "gocache=$(go env GOCACHE)" >> "${GITHUB_OUTPUT}"

      - name: Cache Go modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.go-cache.outputs.gomodcache }}
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: Cache Go build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.go-cache.outputs.gocache }}
          key: ${{ runner.os }}-go-build-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-build-

      - name: Vendor dependencies
        run: make vendor

      - name: Build provider artifacts
        run: make -j2 build

      - name: Log in to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-'))
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Publish runtime image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-'))
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Export runtime image
        shell: bash
        run: |
          mkdir -p .artifacts
          docker save "${IMAGE_NAME}:${GITHUB_SHA}" -o .artifacts/provider-litellm-image.tar

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-litellm-build-artifacts
          path: |
            .artifacts/provider-litellm-image.tar
            _output/**
          if-no-files-found: warn

  e2e-tests:
    runs-on: ubuntu-24.04
    needs: build-publish-artifacts
    # The e2e suite provisions real resources, so it only runs when a LiteLLM
    # endpoint is configured for this repository.
    if: needs.build-publish-artifacts.result == 'success' && vars.RUN_E2E == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4

      - name: Setup Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: provider-litellm-build-artifacts
          path: .artifacts

      - name: Load runtime image
        if: hashFiles('.artifacts/provider-litellm-image.tar') != ''
        run: docker load -i .artifacts/provider-litellm-image.tar

      - name: Vendor dependencies
        run: make vendor

      - name: Run e2e tests
        env:
          PROVIDER_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          UPTEST_PROVIDER_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          LITELLM_API_BASE: ${{ secrets.LITELLM_API_BASE }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
        run: make e2e
