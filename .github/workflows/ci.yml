name: CI

on:
  push:
    branches:
      - main
      - release-*
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  GO_VERSION: '1.27.0'
  GOLANGCI_LINT_VERSION: 'v2.13.1'
  XPKG_REG_ORGS: 'ghcr.io/corewire'
  XPKG_REG_ORGS_NO_PROMOTE: 'ghcr.io/corewire'

jobs:
  detect-noop:
    runs-on: ubuntu-24.04
    outputs:
      noop: ${{ steps.skip.outputs.should_skip }}
    steps:
      - name: Detect no-op changes
        id: skip
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          paths_ignore: '["**/*.md", "**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.gif"]'
          do_not_skip: '["workflow_dispatch", "push"]'

  lint:
    runs-on: ubuntu-24.04
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Find Go cache paths
        id: go-cache
        shell: bash
        run: |
          echo "gomodcache=$(go env GOMODCACHE)" >> "${GITHUB_OUTPUT}"
          echo "gocache=$(go env GOCACHE)" >> "${GITHUB_OUTPUT}"

      - name: Cache Go modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.go-cache.outputs.gomodcache }}
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: Cache Go build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.go-cache.outputs.gocache }}
          key: ${{ runner.os }}-go-build-lint-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-lint-

      - name: Cache Go tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/go/bin
            ~/.cache/golangci-lint
          key: ${{ runner.os }}-go-tools-${{ env.GOLANGCI_LINT_VERSION }}
          restore-keys: |
            ${{ runner.os }}-go-tools-

      - name: Vendor dependencies
        run: make vendor

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6 # v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          verify: false

  check-diff:
    runs-on: ubuntu-24.04
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Find Go cache paths
        id: go-cache
        shell: bash
        run: |
          echo "gomodcache=$(go env GOMODCACHE)" >> "${GITHUB_OUTPUT}"
          echo "gocache=$(go env GOCACHE)" >> "${GITHUB_OUTPUT}"

      - name: Cache Go modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.go-cache.outputs.gomodcache }}
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: Cache Go build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.go-cache.outputs.gocache }}
          key: ${{ runner.os }}-go-build-diff-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-diff-

      - name: Vendor dependencies
        run: make vendor

      - name: Check config/generated.lst freshness
        run: make generated-lst-check

      - name: Check generated code diff
        run: make generate && git diff --exit-code

  unit-tests:
    runs-on: ubuntu-24.04
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Find Go cache paths
        id: go-cache
        shell: bash
        run: |
          echo "gomodcache=$(go env GOMODCACHE)" >> "${GITHUB_OUTPUT}"
          echo "gocache=$(go env GOCACHE)" >> "${GITHUB_OUTPUT}"

      - name: Cache Go modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.go-cache.outputs.gomodcache }}
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: Cache Go build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.go-cache.outputs.gocache }}
          key: ${{ runner.os }}-go-build-test-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-test-

      - name: Vendor dependencies
        run: make vendor

      - name: Run unit tests
        run: make -j2 test

  build-publish-artifacts:
    runs-on: ubuntu-24.04
    needs:
      - detect-noop
      - lint
      - check-diff
      - unit-tests
    if: needs.detect-noop.outputs.noop != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Find Go cache paths
        id: go-cache
        shell: bash
        run: |
          echo "gomodcache=$(go env GOMODCACHE)" >> "${GITHUB_OUTPUT}"
          echo "gocache=$(go env GOCACHE)" >> "${GITHUB_OUTPUT}"

      - name: Cache Go modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.go-cache.outputs.gomodcache }}
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: Cache Go build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.go-cache.outputs.gocache }}
          key: ${{ runner.os }}-go-build-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-build-

      - name: Vendor dependencies
        run: make vendor

      - name: Build provider packages
        run: make -j2 build

      - name: Log in to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-'))
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish provider packages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-'))
        run: make publish BRANCH_NAME=${{ github.ref_name }}

      - name: Upload provider packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-litellm-xpkg
          path: _output/xpkg/**
          if-no-files-found: error

  e2e-tests:
    runs-on: ubuntu-24.04
    needs:
      - detect-noop
      - build-publish-artifacts
    if: needs.build-publish-artifacts.result == 'success' && needs.detect-noop.outputs.noop != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Find Go cache paths
        id: go-cache
        shell: bash
        run: |
          echo "gomodcache=$(go env GOMODCACHE)" >> "${GITHUB_OUTPUT}"
          echo "gocache=$(go env GOCACHE)" >> "${GITHUB_OUTPUT}"

      - name: Cache Go modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.go-cache.outputs.gomodcache }}
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: Cache Go build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.go-cache.outputs.gocache }}
          key: ${{ runner.os }}-go-build-e2e-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-e2e-

      - name: Vendor dependencies
        run: make vendor

      - name: Run e2e tests
        run: make e2e

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          kubectl -n crossplane-system logs -l pkg.crossplane.io/revision --tail=200 || true
          kubectl -n litellm logs deployment/litellm --tail=100 || true
          kubectl get managed -o wide || true
          kubectl get events --all-namespaces --sort-by='.lastTimestamp' | tail -50 || true
