apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: key
spec:
  timeouts:
    apply: 5m
    assert: 10m
    delete: 5m
  steps:
  - name: create-prerequisites
    try:
    - apply:
        file: model-secret.yaml
    - apply:
        file: model.yaml
    - assert:
        file: model-assert.yaml
  - name: create-key
    try:
    - apply:
        file: key.yaml
    - assert:
        file: key-assert.yaml
  - name: update-key
    try:
    - patch:
        file: key-patch.yaml
    - assert:
        file: key-updated-assert.yaml
  - name: delete-key
    try:
    - delete:
        file: key.yaml
    - error:
        file: key-assert.yaml
  - name: delete-prerequisites
    try:
    - delete:
        file: model.yaml
    - error:
        file: model-assert.yaml
