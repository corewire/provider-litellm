apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: vectorstore
spec:
  timeouts:
    apply: 5m
    assert: 10m
    delete: 5m
  steps:
  - name: cleanup-stale-resources
    try:
    - delete:
        ref:
          apiVersion: litellm.crossplane.io/v1alpha1
          kind: VectorStore
          name: e2e-vectorstore
    - delete:
        ref:
          apiVersion: litellm.crossplane.io/v1alpha1
          kind: Credential
          name: e2e-vectorstore-credential
    - script:
        content: |
          set -euo pipefail
          # Delete stale resources from LiteLLM if they exist
          kubectl exec -n litellm deploy/litellm -- python3 -c "
          import urllib.request, json, sys
          for name in ['e2e-vectorstore-credential']:
              data = json.dumps({'credential_name': name}).encode()
              req = urllib.request.Request(f'http://localhost:4000/credentials/{name}', data=data, headers={'Authorization': 'Bearer sk-e2e-master-key', 'Content-Type': 'application/json'}, method='DELETE')
              try: urllib.request.urlopen(req)
              except: pass
          " || true
  - name: create-prerequisites
    try:
    - apply:
        file: credential-values-secret.yaml
    - apply:
        file: credential.yaml
    - assert:
        file: credential-assert.yaml
  - name: create-vectorstore
    try:
    - apply:
        file: vectorstore.yaml
    - assert:
        file: vectorstore-assert.yaml
  - name: update-vectorstore
    try:
    - patch:
        file: vectorstore-patch.yaml
    - assert:
        file: vectorstore-updated-assert.yaml
  - name: delete-vectorstore
    try:
    - delete:
        file: vectorstore.yaml
    - error:
        file: vectorstore-assert.yaml
  - name: delete-credential
    try:
    - delete:
        file: credential.yaml
    - error:
        file: credential-assert.yaml
