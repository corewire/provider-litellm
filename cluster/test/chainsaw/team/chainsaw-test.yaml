apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: team
spec:
  timeouts:
    apply: 5m
    assert: 10m
    delete: 5m
  steps:
  - name: create-prerequisites
    try:
    - apply:
        file: model-secret.yaml
    - apply:
        file: model.yaml
    - assert:
        file: model-assert.yaml
  - name: create-team
    try:
    - apply:
        file: team.yaml
    - assert:
        file: team-assert.yaml
  - name: update-team
    try:
    - patch:
        file: team-patch.yaml
    - assert:
        file: team-updated-assert.yaml
  - name: delete-team
    try:
    - delete:
        file: team.yaml
    - error:
        file: team-assert.yaml
  - name: delete-prerequisites
    try:
    - delete:
        file: model.yaml
    - error:
        file: model-assert.yaml
