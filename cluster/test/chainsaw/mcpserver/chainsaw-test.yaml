apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: mcpserver
spec:
  timeouts:
    apply: 5m
    assert: 10m
    delete: 5m
  steps:
  - name: create-mcpserver
    try:
    - apply:
        file: mcpserver.yaml
    - assert:
        file: mcpserver-assert.yaml
  - name: update-mcpserver
    try:
    - patch:
        file: mcpserver-patch.yaml
    - assert:
        file: mcpserver-updated-assert.yaml
  - name: delete-mcpserver
    try:
    - delete:
        file: mcpserver.yaml
    - error:
        file: mcpserver-assert.yaml
