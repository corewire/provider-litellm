apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: organizationmember
spec:
  timeouts:
    apply: 5m
    assert: 10m
    delete: 5m
  steps:
  - name: create-organization
    try:
    - apply:
        file: organization.yaml
    - assert:
        file: organization-assert.yaml
  - name: create-organizationmember
    try:
    - script:
        content: |
          set -euo pipefail
          ORGANIZATION_ID=""
          for _ in $(seq 1 60); do
            ORGANIZATION_ID="$(kubectl get organizations.litellm.crossplane.io e2e-organization-for-member -o jsonpath='{.status.atProvider.id}' 2>/dev/null || true)"
            if [ -n "${ORGANIZATION_ID}" ]; then
              break
            fi
            sleep 5
          done
          test -n "${ORGANIZATION_ID}"
          cat <<EOF | kubectl apply -f -
          apiVersion: litellm.crossplane.io/v1alpha1
          kind: OrganizationMember
          metadata:
            name: e2e-organizationmember
          spec:
            forProvider:
              organizationId: "${ORGANIZATION_ID}"
              userId: user-org-1
              userEmail: org-e2e@example.com
              role: user
            providerConfigRef:
              name: default
          EOF
    - assert:
        file: organizationmember-assert.yaml
  - name: update-organizationmember
    try:
    - patch:
        file: organizationmember-patch.yaml
    - assert:
        file: organizationmember-updated-assert.yaml
  - name: delete-organizationmember
    try:
    - delete:
        file: organizationmember-delete.yaml
    - error:
        file: organizationmember-assert.yaml
  - name: delete-organization
    try:
    - delete:
        file: organization.yaml
    - error:
        file: organization-assert.yaml
