apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: organizationmemberadd
spec:
  timeouts:
    apply: 5m
    assert: 10m
    delete: 5m
  steps:
  - name: create-user
    try:
    - script:
        content: |
          set -euo pipefail
          kubectl exec -n litellm deploy/litellm -- python3 -c "
          import urllib.request, json
          data = json.dumps({'user_id': 'user-org-add-1', 'user_email': 'org-add-e2e@example.com'}).encode()
          req = urllib.request.Request('http://localhost:4000/user/new', data=data, headers={'Authorization': 'Bearer sk-e2e-master-key', 'Content-Type': 'application/json'})
          try:
              urllib.request.urlopen(req)
          except urllib.error.HTTPError as e:
              if e.code != 409: raise
          "
  - name: create-organization
    try:
    - apply:
        file: organization.yaml
    - assert:
        file: organization-assert.yaml
  - name: create-organizationmemberadd
    try:
    - script:
        content: |
          set -euo pipefail
          ORGANIZATION_ID=""
          for _ in $(seq 1 60); do
            ORGANIZATION_ID="$(kubectl get organizations.litellm.crossplane.io e2e-organization-for-member-add -o jsonpath='{.status.atProvider.id}' 2>/dev/null || true)"
            if [ -n "${ORGANIZATION_ID}" ]; then
              break
            fi
            sleep 5
          done
          test -n "${ORGANIZATION_ID}"
          cat <<EOF | kubectl apply -f -
          apiVersion: litellm.crossplane.io/v1alpha1
          kind: OrganizationMemberAdd
          metadata:
            name: e2e-organizationmemberadd
          spec:
            forProvider:
              organizationId: "${ORGANIZATION_ID}"
              member:
              - userId: user-org-add-1
                userEmail: org-add-e2e@example.com
                role: internal_user
            providerConfigRef:
              name: default
          EOF
    - assert:
        file: organizationmemberadd-assert.yaml
  - name: update-organizationmemberadd
    try:
    - patch:
        file: organizationmemberadd-patch.yaml
    - assert:
        file: organizationmemberadd-updated-assert.yaml
  - name: delete-organizationmemberadd
    try:
    - delete:
        file: organizationmemberadd-delete.yaml
    - error:
        file: organizationmemberadd-assert.yaml
  - name: delete-organization
    try:
    - delete:
        file: organization.yaml
    - error:
        file: organization-assert.yaml
