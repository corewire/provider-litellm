apiVersion: litellm.crossplane.io/v1alpha1
kind: Credential
metadata:
  name: e2e-credential
spec:
  forProvider:
    credentialName: e2e-cred
    credentialInfo:
      provider: openai
    credentialValuesSecretRef:
      name: e2e-credential-values
      namespace: upbound-system
  providerConfigRef:
    name: default
