apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: credential
spec:
  timeouts:
    apply: 5m
    assert: 10m
    delete: 5m
  steps:
  - name: cleanup-stale-credential
    try:
    - delete:
        ref:
          apiVersion: litellm.crossplane.io/v1alpha1
          kind: Credential
          name: e2e-credential
    - script:
        content: |
          set -euo pipefail
          # Delete stale credential from LiteLLM if it exists
          kubectl exec -n litellm deploy/litellm -- python3 -c "
          import urllib.request, json, sys
          data = json.dumps({'credential_name': 'e2e-cred'}).encode()
          req = urllib.request.Request('http://localhost:4000/credentials/e2e-cred', data=data, headers={'Authorization': 'Bearer sk-e2e-master-key', 'Content-Type': 'application/json'}, method='DELETE')
          try:
              urllib.request.urlopen(req)
          except:
              sys.exit(0)
          " || true
  - name: create-prerequisites
    try:
    - apply:
        file: credential-values-secret.yaml
  - name: create-credential
    try:
    - apply:
        file: credential.yaml
    - assert:
        file: credential-assert.yaml
  - name: update-credential
    try:
    - patch:
        file: credential-patch.yaml
    - assert:
        file: credential-updated-assert.yaml
  - name: delete-credential
    try:
    - delete:
        file: credential.yaml
    - error:
        file: credential-assert.yaml
