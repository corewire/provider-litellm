apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: teammember
spec:
  timeouts:
    apply: 5m
    assert: 10m
    delete: 5m
  steps:
  - name: create-team
    try:
    - apply:
        file: team.yaml
    - assert:
        file: team-assert.yaml
  - name: create-teammember
    try:
    - script:
        content: |
          set -euo pipefail
          TEAM_ID=""
          for _ in $(seq 1 60); do
            TEAM_ID="$(kubectl get teams.litellm.crossplane.io e2e-team-for-member -o jsonpath='{.status.atProvider.id}' 2>/dev/null || true)"
            if [ -n "${TEAM_ID}" ]; then
              break
            fi
            sleep 5
          done
          test -n "${TEAM_ID}"
          cat <<EOF | kubectl apply -f -
          apiVersion: litellm.crossplane.io/v1alpha1
          kind: TeamMember
          metadata:
            name: e2e-teammember
          spec:
            forProvider:
              teamId: "${TEAM_ID}"
              userId: user-e2e-1
              userEmail: e2e@example.com
              role: user
              maxBudgetInTeam: 50
            providerConfigRef:
              name: default
          EOF
    - assert:
        file: teammember-assert.yaml
  - name: update-teammember
    try:
    - patch:
        file: teammember-patch.yaml
    - assert:
        file: teammember-updated-assert.yaml
  - name: delete-teammember
    try:
    - delete:
        file: teammember-delete.yaml
    - error:
        file: teammember-assert.yaml
  - name: delete-team
    try:
    - delete:
        file: team.yaml
    - error:
        file: team-assert.yaml
