apiVersion: meta.pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-litellm
  annotations:
    meta.crossplane.io/maintainer: Corewire <hello@corewire.de>
    meta.crossplane.io/source: github.com/corewire/provider-litellm
    meta.crossplane.io/license: Apache-2.0
    meta.crossplane.io/description: |
      An upjet-based Crossplane provider for LiteLLM.
      Manages LiteLLM models, teams, API keys, organizations, and credentials
      as Kubernetes custom resources using the LiteLLM REST API.
spec:
  capabilities:
  - safe-start
  crossplane:
    version: ">=2.0.0-0"
  dependsOn: []
