apiVersion: v1
kind: Secret
metadata:
  name: e2e-model-credentials
  namespace: upbound-system
type: Opaque
stringData:
  model-api-key: sk-e2e-model-key
---
apiVersion: litellm.crossplane.io/v1alpha1
kind: Model
metadata:
  annotations:
    meta.upbound.io/example-id: litellm/v1alpha1/model
  labels:
    testing.upbound.io/example-name: gpt4
  name: gpt4
spec:
  forProvider:
    modelName: gpt-4-proxy
    customLlmProvider: openai
    baseModel: gpt-4
    mode: chat
    tier: paid
    inputCostPerMillionTokens: 30
    outputCostPerMillionTokens: 60
    modelApiKeySecretRef:
      key: model-api-key
      name: e2e-model-credentials
      namespace: upbound-system
  providerConfigRef:
    name: default
