apiVersion: v1
kind: Secret
metadata:
  name: e2e-credential-values
  namespace: upbound-system
type: Opaque
stringData:
  OPENAI_API_KEY: sk-e2e-openai-key
---
apiVersion: litellm.crossplane.io/v1alpha1
kind: Credential
metadata:
  name: e2e-credential
spec:
  forProvider:
    credentialName: e2e-credential
    credentialInfo:
      provider: openai
    credentialValuesSecretRef:
      name: e2e-credential-values
      namespace: upbound-system
  providerConfigRef:
    name: default
