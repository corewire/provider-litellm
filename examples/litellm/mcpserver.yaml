apiVersion: litellm.crossplane.io/v1alpha1
kind: McpServer
metadata:
  annotations:
    meta.upbound.io/example-id: litellm/v1alpha1/mcpserver
  labels:
    testing.upbound.io/example-name: github_server
  name: github-server
spec:
  forProvider:
    serverName: github-mcp-server
    alias: github
    description: GitHub MCP server for repository operations
    transport: http
    authType: bearer
    url: https://api.github.com/mcp
  providerConfigRef:
    name: default
