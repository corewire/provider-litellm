apiVersion: v1
kind: Secret
metadata:
  name: litellm-credentials
  namespace: crossplane-system
type: Opaque
stringData:
  credentials: |
    {
      "api_base": "http://your-litellm-server:4000",
      "api_key": "your-master-key"
    }
---
apiVersion: litellm.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: litellm-credentials
      key: credentials
