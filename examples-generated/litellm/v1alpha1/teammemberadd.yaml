apiVersion: litellm.crossplane.io/v1alpha1
kind: TeamMemberAdd
metadata:
  annotations:
    meta.upbound.io/example-id: litellm/v1alpha1/teammemberadd
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    allowedModels:
    - gpt-4
    budgetDuration: 30d
    maxBudgetInTeam: 100
    member:
    - role: admin
      userId: user-456
    - role: user
      userEmail: user@example.com
    rpmLimit: 100
    teamId: team-123
    tpmLimit: 100000
