                  "team_id": "${litellm_team.development.id}"
                }
              references:
                team_id: litellm_team.development.id
              dependencies:
                litellm_team.development: |-
                    {
                      "max_budget": 500,
                      "models": [
                        "gpt-4",
                        "gpt-3.5-turbo"
                      ],
                      "team_alias": "development-team",
                      "team_member_permissions": [
                        "create_key",
                        "view_spend"
                      ]
                    }
            - name: dynamic_example
              manifest: |-
                {
                  "dynamic": {
                    "member": [
                      {
                        "content": [
                          {
                            "role": "${member.value.role}",
                            "user_email": "${lookup(member.value, \"user_email\", null)}",
                            "user_id": "${lookup(member.value, \"user_id\", null)}"
                          }
                        ],
                        "for_each": "${local.team_members}"
                      }
                    ]
                  },
                  "max_budget_in_team": 200,
                  "team_id": "team-456"
                }
              references:
                dynamic.content.role: member.value.role
                dynamic.for_each: local.team_members
            - name: budget_example
              manifest: |-
                {
                  "max_budget_in_team": 100,
                  "member": [
                    {
                      "role": "admin",
                      "user_email": "user1@example.com"
                    },
                    {
                      "role": "user",
                      "user_email": "user2@example.com"
                    },
                    {
                      "role": "user",
                      "user_id": "user123"
                    }
                  ],
                  "team_id": "${litellm_team.example.id}"
                }
              references:
                team_id: litellm_team.example.id
        argumentDocs:
            /team/member_add: endpoint
            /team/member_delete: endpoint
            /team/member_update: endpoint (preserves member identity)
            allowed_models: '- (Optional) List of models each team member can access. If not set, members inherit the team''s default_team_member_models or all team models.'
            budget_duration: '- (Optional) Duration after which each member''s budget resets, for example "1h", "24h", "7d", "30d". If not set, the budget never resets.'
            max_budget_in_team: '- (Optional) The maximum budget allocated for the team members.'
            member: '- (Required) One or more member blocks defining team members. Each block supports:'
            role: '- (Required) The role of the user in the team. Must be one of: "admin" or "user".'
            rpm_limit: '- (Optional) Requests per minute limit applied to each team member. Sent via /team/member_update after members are added, since /team/member_add does not accept it.'
            team_id: '- (Required) The ID of the team to add members to.'
            tpm_limit: '- (Optional) Tokens per minute limit applied to each team member. Sent via /team/member_update after members are added, since /team/member_add does not accept it.'
            user_email: '- (Optional) The email of the user to add to the team.'
            user_id: '- (Optional) The ID of the user to add to the team.'
        importStatements:
            - terraform import litellm_team_member_add.example team-123:user-456
    litellm_unified_access_group:
        subCategory: ""
        name: litellm_unified_access_group
        title: ""
        examples:
            - name: engineering
              manifest: |-
                {
                  "access_group_name": "engineering-access",
                  "access_mcp_server_ids": [
                    "${litellm_mcp_server.github.id}"
                  ],
                  "access_model_names": [
                    "gpt-4",
                    "claude-3-sonnet"
                  ],
                  "assigned_team_ids": [
                    "${litellm_team.engineering.id}"
                  ],
                  "description": "Models and tools for the engineering org"
                }
              references:
                access_mcp_server_ids: litellm_mcp_server.github.id
                assigned_team_ids: litellm_team.engineering.id
        argumentDocs:
            access_agent_ids: '- (Optional) Agent IDs this access group grants access to.'
            access_group_id: '- Same as id.'
            access_group_name: '- (Required) Display name of the unified access group.'
            access_mcp_server_ids: '- (Optional) MCP server IDs this access group grants access to.'
            access_model_names: '- (Optional) Model names this access group grants access to.'
            assigned_key_ids: '- (Optional) Key IDs (token hashes) the access group is assigned to.'
            assigned_team_ids: '- (Optional) Team IDs the access group is assigned to.'
            created_at: '- Timestamp when the access group was created.'
            created_by: '- User who created the access group.'
            description: '- (Optional) Description of the unified access group.'
            id: '- The unique identifier of the unified access group.'
            updated_at: '- Timestamp when the access group was last updated.'
            updated_by: '- User who last updated the access group.'
        importStatements:
            - terraform import litellm_unified_access_group.engineering <access-group-id>
    litellm_user:
        subCategory: ""
        name: litellm_user
        title: ""
        examples:
            - name: alice
              manifest: |-
                {
                  "budget_duration": "30d",
                  "max_budget": 100,
                  "metadata": {
                    "department": "engineering"
                  },
                  "model_max_budget": "${jsonencode({\n    \"gpt-4o\" = {\n      max_budget = 25.0\n    }\n  })}",
                  "models": [
                    "gpt-4o",
                    "claude-sonnet-4-5"
                  ],
                  "rpm_limit": 1000,
                  "teams": [
                    "${litellm_team.engineering.id}"
                  ],
                  "tpm_limit": 100000,
                  "user_alias": "Alice",
                  "user_email": "alice@example.com",
                  "user_role": "internal_user"
                }
              references:
                teams: litellm_team.engineering.id
        argumentDocs:
            aliases: (Optional) - Map of model aliases for the user
            auto_create_key: (Optional, Default true, Forces new resource) - Whether to auto-create an API key on creation
            blocked: (Optional, Default false) - Whether the user is blocked from making requests
            budget_duration: (Optional) - Budget reset period, e.g. 30s, 30m, 30d
            config: (Optional) - Map of config values for the user
            guardrails: (Optional) - List of guardrails applied to the user's requests
            id: '- The user ID'
            key: (Sensitive) - The auto-created API key for the user, populated when auto_create_key is true
            key_alias: (Optional) - Alias for the auto-created API key
            max_budget: (Optional) - Maximum budget in USD for the user
            max_parallel_requests: (Optional) - Maximum number of parallel requests
            metadata: (Optional) - Map of metadata for the user
            model_max_budget: (Optional) - JSON string of per-model budget config, e.g. jsonencode({"gpt-4o" = {max_budget = 10.0}})
            models: (Optional) - Models the user is allowed to call
            permissions: (Optional) - Map of permission values for the user
            rpm_limit: (Optional) - Requests per minute limit
            send_invite_email: (Optional, Default false, Forces new resource) - Whether to send an invite email on creation
            teams: (Optional) - List of team IDs the user belongs to
            tpm_limit: (Optional) - Tokens per minute limit
            user_alias: (Optional) - Descriptive name for the user
            user_email: (Optional) - Email address of the user
            user_id: (Optional, Forces new resource) - Unique ID for the user. Generated by the server if not provided
            user_role: (Optional) - Role of the user. One of proxy_admin, proxy_admin_viewer, internal_user, internal_user_viewer
        importStatements:
            - terraform import litellm_user.alice <user-id>
    litellm_vector_store:
        subCategory: ""
        name: litellm_vector_store
        title: ""
        examples:
            - name: bedrock_kb
              manifest: |-
                {
                  "custom_llm_provider": "bedrock",
                  "litellm_credential_name": "${litellm_credential.bedrock_cred.credential_name}",
                  "litellm_params": {
                    "vector_store_id": "T37J8R4WTM"
                  },
                  "vector_store_description": "Bedrock vector store for the LiteLLM website knowledgebase",
                  "vector_store_metadata": {
                    "source": "https://www.litellm.com/docs"
                  },
                  "vector_store_name": "bedrock-litellm-website-knowledgebase"
                }
              references:
                litellm_credential_name: litellm_credential.bedrock_cred.credential_name
              dependencies:
                litellm_credential.bedrock_cred: |-
                    {
                      "credential_info": {
                        "provider": "bedrock",
                        "region": "us-east-1"
                      },
                      "credential_name": "bedrock-knowledge-base",
                      "credential_values": {
                        "aws_access_key_id": "${var.aws_access_key_id}",
                        "aws_region": "us-east-1",
                        "aws_secret_access_key": "${var.aws_secret_access_key}"
                      }
                    }
            - name: openai_store
              manifest: |-
                {
                  "custom_llm_provider": "openai",
                  "litellm_credential_name": "${litellm_credential.openai_cred.credential_name}",
                  "litellm_params": {
                    "vector_store_id": "vs_687ae3b2439881918b433cb99d10662e"
                  },
                  "vector_store_description": "OpenAI vector store for document search",
                  "vector_store_metadata": {
                    "environment": "production",
                    "purpose": "file-search"
                  },
                  "vector_store_name": "openai-knowledge-base"
                }
              references:
                litellm_credential_name: litellm_credential.openai_cred.credential_name
              dependencies:
                litellm_credential.openai_cred: |-
                    {
                      "credential_info": {
                        "provider": "openai"
                      },
                      "credential_name": "openai-vector-store",
                      "credential_values": {
                        "api_key": "${var.openai_api_key}"
                      }
                    }
            - name: azure_store
              manifest: |-
                {
                  "custom_llm_provider": "azure",
                  "litellm_credential_name": "${litellm_credential.azure_cred.credential_name}",
                  "litellm_params": {
                    "vector_store_id": "vs_azure_example_id"
                  },
                  "vector_store_description": "Azure vector store for enterprise search",
                  "vector_store_metadata": {
                    "environment": "production",
                    "team": "enterprise"
                  },
                  "vector_store_name": "azure-knowledge-base"
                }
              references:
                litellm_credential_name: litellm_credential.azure_cred.credential_name
              dependencies:
                litellm_credential.azure_cred: |-
                    {
                      "credential_info": {
                        "provider": "azure"
                      },
                      "credential_name": "azure-vector-store",
                      "credential_values": {
                        "api_base": "${var.azure_openai_endpoint}",
                        "api_key": "${var.azure_openai_key}",
                        "api_version": "2023-12-01-preview"
                      }
                    }
            - name: vertex_rag
              manifest: |-
                {
                  "custom_llm_provider": "vertex_ai",
                  "litellm_credential_name": "${litellm_credential.vertex_cred.credential_name}",
                  "litellm_params": {
                    "vector_store_id": "6917529027641081856"
                  },
                  "vector_store_description": "Vertex AI RAG Engine for enterprise knowledge",
                  "vector_store_metadata": {
                    "environment": "production",
                    "project": "your-gcp-project"
                  },
                  "vector_store_name": "vertex-rag-corpus"
                }
              references:
                litellm_credential_name: litellm_credential.vertex_cred.credential_name
              dependencies:
                litellm_credential.vertex_cred: |-
                    {
                      "credential_info": {
                        "project": "your-gcp-project",
                        "provider": "vertex_ai"
                      },
                      "credential_name": "vertex-rag-engine",
                      "credential_values": {
                        "service_account_key": "${var.gcp_service_account_key}"
                      }
                    }
            - name: pgvector_store
              manifest: |-
                {
                  "custom_llm_provider": "pgvector",
                  "litellm_credential_name": "${litellm_credential.pgvector_cred.credential_name}",
                  "litellm_params": {
                    "api_base": "https://your-pgvector-host.com"
                  },
                  "vector_store_description": "PostgreSQL vector store with pgvector extension",
                  "vector_store_metadata": {
                    "database": "vector_db",
                    "environment": "production",
                    "table": "embeddings"
                  },
                  "vector_store_name": "postgres-vector-store"
                }
              references:
                litellm_credential_name: litellm_credential.pgvector_cred.credential_name
              dependencies:
                litellm_credential.pgvector_cred: |-
                    {
                      "credential_info": {
                        "host": "your-pgvector-host.com",
                        "provider": "pgvector"
                      },
                      "credential_name": "pgvector-store",
                      "credential_values": {
                        "api_base": "https://your-pgvector-host.com",
                        "api_key": "${var.pgvector_api_key}"
                      }
                    }
        argumentDocs:
            created_at: '- Timestamp when the vector store was created.'
            custom_llm_provider: '- (Required) The vector store provider. Supported values: "bedrock", "openai", "azure", "vertex_ai", "pgvector".'
            litellm_credential_name: '- (Optional) Name of the LiteLLM credential to use for authentication.'
            litellm_params: '- (Optional, Sensitive) Map of additional parameters specific to the vector store provider. Do not put API keys or other secrets here; this map is stored unencrypted in state. Store secrets in a litellm_credential and reference it via litellm_credential_name.'
            updated_at: '- Timestamp when the vector store was last updated.'
            vector_store_description: '- (Optional) Description of the vector store.'
            vector_store_id: '- The unique identifier of the vector store.'
            vector_store_metadata: '- (Optional) Map of metadata associated with the vector store.'
            vector_store_name: '- (Required) Name of the vector store.'
        importStatements:
            - terraform import litellm_vector_store.example "vector-store-id"
