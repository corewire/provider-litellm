name: BerriAI/litellm
resources:
    litellm_access_group:
        subCategory: ""
        name: litellm_access_group
        title: ""
        examples:
            - name: production
              manifest: |-
                {
                  "access_group": "production-models",
                  "model_names": [
                    "gpt-4",
                    "claude-3-sonnet"
                  ]
                }
            - name: pinned
              manifest: |-
                {
                  "access_group": "pinned-deployments",
                  "model_ids": [
                    "4dbd9f43-...",
                    "9a1e2c77-..."
                  ]
                }
        argumentDocs:
            access_group: '- (Required, Forces new resource) Name of the access group.'
            deployment_count: '- Number of deployments currently tagged with this access group.'
            id: '- The access group name.'
            model_ids: '- (Optional) List of specific deployment model IDs to include in the group. Takes precedence over model_names when both are set.'
            model_names: '- (Optional) List of model names (the model_name of each deployment) to include in the group. At least one of model_names or model_ids must be set.'
        importStatements:
            - terraform import litellm_access_group.production production-models
    litellm_agent:
        subCategory: ""
        name: litellm_agent
        title: ""
        examples:
            - name: hello_world
              manifest: |-
                {
                  "agent_card_params": "${jsonencode({\n    protocolVersion    = \"1.0\"\n    name               = \"Hello World Agent\"\n    description        = \"Just a hello world agent\"\n    url                = \"http://localhost:9999/\"\n    version            = \"1.0.0\"\n    defaultInputModes  = [\"text\"]\n    defaultOutputModes = [\"text\"]\n    capabilities = {\n      streaming = true\n    }\n    skills = [\n      {\n        id          = \"hello_world\"\n        name        = \"Returns hello world\"\n        description = \"just returns hello world\"\n        tags        = [\"hello world\"]\n        examples    = [\"hi\", \"hello world\"]\n      }\n    ]\n  })}",
                  "agent_name": "hello-world-agent",
                  "extra_headers": [
                    "x-request-id"
                  ],
                  "litellm_params": "${jsonencode({\n    make_public = false\n  })}",
                  "object_permission": "${jsonencode({\n    models      = [\"gpt-4-proxy\"]\n    mcp_servers = [\"my-mcp-server-id\"]\n  })}",
                  "rpm_limit": 1000,
                  "session_rpm_limit": 100,
                  "session_tpm_limit": 10000,
                  "static_headers": {
                    "x-api-key": "${var.agent_api_key}"
                  },
                  "tpm_limit": 100000
                }
        argumentDocs:
            agent_card_params: '- (Required) The A2A agent card as a JSON object string (use jsonencode). Supports the standard A2A card fields: name, description, url, version, protocolVersion, capabilities, skills, defaultInputModes, defaultOutputModes, preferredTransport, iconUrl, provider, documentationUrl, and more. The proxy merges LiteLLM-fronting fields (such as supportedInterfaces) into the stored card, so the value you configure stays authoritative in state.'
            agent_name: '- (Required) Name of the agent. Must be unique on the proxy.'
            created_at: '- Timestamp when the agent was created.'
            created_by: '- User who created the agent.'
            extra_headers: '- (Optional) List of incoming request header names to forward to the agent.'
            id: '- The agent ID assigned by LiteLLM.'
            litellm_params: '- (Optional, Sensitive) LiteLLM-specific parameters as a JSON object string. May include secrets such as api_key, so the value is never read back from the API; the configured value is authoritative.'
            object_permission: '- (Optional) Access control permissions as a JSON object string with keys mcp_servers, mcp_access_groups, mcp_tool_permissions, models, and agents.'
            rpm_limit: '- (Optional) Requests per minute limit for the agent.'
            session_rpm_limit: '- (Optional) Per-session requests per minute limit.'
            session_tpm_limit: '- (Optional) Per-session tokens per minute limit.'
            static_headers: '- (Optional, Sensitive) Map of static headers sent with agent requests. May hold tokens, so it is never read back from the API.'
            tpm_limit: '- (Optional) Tokens per minute limit for the agent.'
            updated_at: '- Timestamp when the agent was last updated.'
            updated_by: '- User who last updated the agent.'
        importStatements:
            - terraform import litellm_agent.example <agent_id>
    litellm_budget:
        subCategory: ""
        name: litellm_budget
        title: ""
        examples:
            - name: engineering
              manifest: |-
                {
                  "budget_duration": "30d",
                  "budget_id": "engineering-monthly",
                  "max_budget": 500,
                  "max_parallel_requests": 100,
                  "model_max_budget": "${jsonencode({\n    \"gpt-4o\" = {\n      max_budget      = 100.0\n      budget_duration = \"1d\"\n    }\n  })}",
                  "rpm_limit": 5000,
                  "soft_budget": 400,
                  "tpm_limit": 500000
                }
        argumentDocs:
            budget_duration: (Optional) - Budget reset period, e.g. 1hr, 1d, 28d
            budget_id: (Optional, Forces new resource) - Unique ID for the budget. Generated by the server if not provided
            budget_reset_at: '- Datetime when the budget is reset'
            id: '- The budget ID'
            max_budget: (Optional) - Requests fail if this budget in USD is exceeded
            max_parallel_requests: (Optional) - Maximum concurrent requests allowed for this budget
            model_max_budget: (Optional) - JSON string of per-model budget config, e.g. jsonencode({"gpt-4o" = {max_budget = 10.0}})
            rpm_limit: (Optional) - Maximum requests per minute allowed for this budget
            soft_budget: (Optional) - Requests do not fail if this is exceeded, but alerts fire
            tpm_limit: (Optional) - Maximum tokens per minute allowed for this budget
        importStatements:
            - terraform import litellm_budget.engineering <budget-id>
    litellm_credential:
        subCategory: ""
        name: litellm_credential
        title: ""
        examples:
            - name: openai_cred
              manifest: |-
                {
                  "credential_info": {
                    "provider": "openai",
                    "purpose": "chat-completions",
                    "region": "us-east-1"
                  },
                  "credential_name": "openai-api-key",
                  "credential_values": {
                    "api_key": "${var.openai_api_key}",
                    "org_id": "${var.openai_org_id}"
                  },
                  "model_id": "gpt-4"
                }
            - name: anthropic_cred
              manifest: |-
                {
                  "credential_info": {
                    "provider": "anthropic",
                    "purpose": "text-generation"
                  },
                  "credential_name": "anthropic-api-key",
                  "credential_values": {
                    "api_key": "${var.anthropic_api_key}"
                  }
                }
            - name: pinecone_cred
              manifest: |-
                {
                  "credential_info": {
                    "environment": "production",
                    "provider": "pinecone",
                    "region": "us-east-1"
                  },
                  "credential_name": "pinecone-production",
                  "credential_values": {
                    "api_key": "${var.pinecone_api_key}",
                    "index_name": "document-embeddings"
                  }
                }
            - name: aws_bedrock
              manifest: |-
                {
                  "credential_info": {
                    "provider": "aws",
                    "region": "us-east-1",
                    "service": "bedrock"
                  },
                  "credential_name": "aws-bedrock-cred",
                  "credential_values": {
                    "aws_access_key_id": "${var.aws_access_key_id}",
                    "aws_region": "us-east-1",
                    "aws_secret_access_key": "${var.aws_secret_access_key}"
                  }
                }
            - name: azure_openai
              manifest: |-
                {
                  "credential_info": {
                    "provider": "azure",
                    "service": "openai"
                  },
                  "credential_name": "azure-openai-cred",
                  "credential_values": {
                    "api_base": "${var.azure_openai_endpoint}",
                    "api_key": "${var.azure_openai_key}",
                    "api_version": "2023-12-01-preview"
                  }
                }
        argumentDocs:
            Sensitive: ', credential_values is still written in plaintext to the state file. Anyone with read access to the state (or state artifacts such as plan files) can recover the configured secrets. Use an encrypted remote backend with tight access controls, and prefer feeding secrets in via variables sourced from a secret manager rather than hardcoding them in configuration.'
            adopt_existing: '- (Optional, default false) Take over a credential of this name that already exists on the proxy instead of failing. Turning this on overwrites the existing credential''s values with the ones in this configuration.'
            credential_info: '- (Optional) Map of additional non-sensitive information about the credential.'
            credential_name: '- (Required) Name of the credential. This will be used as the identifier for the credential.'
            credential_values: '- (Required, Sensitive) Map of sensitive credential values such as API keys, tokens, etc.'
            model_id: '- (Optional) Model ID associated with this credential.'
        importStatements:
            - terraform import litellm_credential.example "credential-name"
    litellm_fallback:
        subCategory: ""
        name: litellm_fallback
        title: ""
        examples:
            - name: gpt4_fallbacks
              manifest: |-
                {
                  "fallback_models": [
                    "claude-3-sonnet",
                    "gpt-3.5-turbo"
                  ],
                  "model": "gpt-4"
                }
            - name: gpt4_context_window
              manifest: |-
                {
                  "fallback_models": [
                    "claude-3-sonnet"
                  ],
                  "fallback_type": "context_window",
                  "model": "gpt-4"
                }
        argumentDocs:
            fallback_models: '- (Required) List of fallback model names in order of priority. Each model must exist on the proxy, and the primary model cannot be its own fallback.'
            fallback_type: '- (Optional, Forces new resource) Type of fallback. One of general (default), context_window, or content_policy.'
            id: '- The primary model name.'
            model: '- (Required, Forces new resource) The model name to configure fallbacks for. The model must already exist on the proxy.'
        importStatements:
            - terraform import litellm_fallback.example gpt-4
    litellm_guardrail:
        subCategory: ""
        name: litellm_guardrail
        title: ""
        examples:
            - name: bedrock_guard
              manifest: |-
                {
                  "default_on": true,
                  "guardrail": "bedrock",
                  "guardrail_info": {
                    "description": "Bedrock content moderation guardrail"
                  },
                  "guardrail_name": "my-bedrock-guard",
                  "litellm_params": "${jsonencode({\n    guardrailIdentifier = \"ff6ujrregl1q\"\n    guardrailVersion    = \"DRAFT\"\n  })}",
                  "mode": "pre_call"
                }
            - name: pii_guard
              manifest: |-
                {
                  "guardrail": "presidio",
                  "guardrail_name": "presidio-pii",
                  "mode": "${jsonencode([\"pre_call\", \"post_call\"])}"
                }
        argumentDocs:
            created_at: '- Timestamp when the guardrail was created.'
            default_on: '- (Optional) Whether the guardrail is enabled by default for all requests.'
            guardrail: '- (Required) The guardrail integration type (e.g. bedrock, lakera, presidio, openai_moderation, hide_secrets).'
            guardrail_info: '- (Optional) Map of additional metadata for the guardrail.'
            guardrail_name: '- (Required) Human-readable name for the guardrail.'
            id: '- The guardrail ID assigned by LiteLLM.'
            litellm_params: '- (Optional, Sensitive) JSON string with additional provider-specific parameters merged into litellm_params (may contain API keys). The API masks these values, so the configured value stays authoritative in state.'
            mode: '- (Required) When to apply the guardrail. A single value (pre_call, post_call, during_call, logging_only) or a JSON array of values.'
        importStatements:
            - terraform import litellm_guardrail.example 123e4567-e89b-12d3-a456-426614174000
    litellm_jwt_key_mapping:
        subCategory: ""
        name: litellm_jwt_key_mapping
        title: ""
        examples:
            - name: alice
              manifest: |-
                {
                  "jwt_claim_name": "client_id",
                  "jwt_claim_value": "dev-alice",
                  "key": "${var.alice_key}"
                }
              references:
                key: var.alice_key
            - name: billing_service
              manifest: |-
                {
                  "description": "Billing service JWT client",
                  "is_active": true,
                  "jwt_claim_name": "client_id",
                  "jwt_claim_value": "billing-service",
                  "key": "${var.billing_service_key}"
                }
              references:
                key: var.billing_service_key
            - name: developer
              manifest: |-
                {
                  "description": "Developer JWT client ${each.key}",
                  "for_each": "${var.jwt_client_keys}",
                  "jwt_claim_name": "client_id",
                  "jwt_claim_value": "${each.key}",
                  "key": "${each.value}"
                }
              references:
                for_each: var.jwt_client_keys
                jwt_claim_value: each.key
                key: each.value
        argumentDocs:
            created_at: '- Timestamp when the mapping was created'
            created_by: '- User who created the mapping'
            description: '- (Optional) Description of the mapping'
            id: '- The mapping ID assigned by LiteLLM'
            is_active: '- (Optional) Whether the mapping is active. Inactive mappings are ignored during JWT auth. Defaults to true'
            jwt_claim_name: '- (Required, ForceNew) Name of the JWT claim to match on, for example client_id, azp or sub. Must match virtual_key_claim_field in the proxy JWT config'
            jwt_claim_value: '- (Required, ForceNew) Value of the claim identifying the JWT client. Unique together with jwt_claim_name, so a second mapping for the same pair fails with a 409'
            key: '- (Optional, Sensitive) The virtual key this claim value maps to, as plaintext. It has to exist already, otherwise the proxy rejects the mapping with The provided key does not match an existing virtual key. Exactly one of key or token_id is required. litellm_key marks its generated key write-only, so this cannot reference a litellm_key resource -- use token_id for that, or supply the plaintext from a variable or a secret manager'
            token_id: '- (Optional) The SHA-256 hash of the virtual key this claim value maps to, which is what the proxy stores. litellm_key exposes it as token_id, so unlike key it can be referenced directly from a litellm_key resource. Not a secret, so it is not marked sensitive. Exactly one of key or token_id is required'
            updated_at: '- Timestamp when the mapping was last updated'
            updated_by: '- User who last updated the mapping'
        importStatements:
            - terraform import litellm_jwt_key_mapping.alice 297a5536-1aeb-4cf1-b666-b3809c2750a8
    litellm_key:
        subCategory: ""
        name: litellm_key
        title: ""
        examples:
            - name: example
              manifest: |-
                {
                  "aliases": {
                    "gpt-3.5-turbo": "chatgpt"
                  },
                  "allowed_cache_controls": [
                    "no-cache",
                    "max-age=3600"
                  ],
                  "blocked": false,
                  "budget_duration": "monthly",
                  "config": {
                    "default_model": "gpt-3.5-turbo"
                  },
                  "duration": "30d",
                  "guardrails": [
                    "content_filter",
                    "token_limit"
                  ],
                  "key_alias": "prod-key-1",
                  "max_budget": 100,
                  "max_parallel_requests": 5,
                  "metadata": {
                    "environment": "production"
                  },
                  "model_max_budget": "${jsonencode({\n    \"gpt-4\" = {\n      budget_limit = 50.0\n      time_period  = \"30d\"\n    }\n  })}",
                  "model_rpm_limit": {
                    "gpt-3.5-turbo": 30
                  },
                  "model_tpm_limit": {
                    "gpt-4": 500
                  },
                  "models": [
                    "gpt-3.5-turbo",
                    "gpt-4"
                  ],
                  "permissions": {
                    "can_create_keys": "true"
                  },
                  "rpm_limit": 60,
                  "soft_budget": 80,
                  "tags": [
                    "production",
                    "api"
                  ],
                  "team_id": "team456",
                  "tpm_limit": 1000,
                  "user_id": "user123"
                }
        argumentDocs:
            aliases: '- (Optional) Map of model aliases. This allows you to create custom names for models when using this key.'
            allowed_cache_controls: '- (Optional) List of allowed cache control directives. This can be used to control caching behavior for requests made with this key.'
            allowed_passthrough_routes: '- (Optional) List of pass-through routes this key is allowed to call.'
            allowed_routes: '- (Optional) List of proxy routes this key is allowed to call.'
            blocked: '- (Optional) Whether this key is blocked. If set to true, the key will be unable to make any requests.'
            budget_duration: '- (Optional) Duration for the budget (e.g., "monthly", "weekly"). This defines the time period for which the max_budget applies.'
            budget_id: '- (Optional) ID of a shared budget (created via litellm_budget) to attach to this key.'
            config: '- (Optional) Configuration options for this key. This can be used to set key-specific settings.'
            duration: '- (Optional) How long the key stays valid, e.g. "30d" or "12h". The proxy stores this as an absolute expires timestamp. Changing the value resets the expiry to the time of the update plus the new duration; removing it from the configuration leaves the current expiry in place.'
            enforced_params: '- (Optional) List of request parameters that callers must supply when using this key (for example user).'
            guardrails: '- (Optional) List of guardrails applied to this key. This can be used to enforce certain safety or quality checks.'
            key: '- The generated API key. This is the actual key value that will be used for authentication.'
            key_alias: '- (Optional) Alias for this key. This provides a human-readable identifier for the key.'
            max_budget: '- (Optional) Maximum budget for this key. This sets an upper limit on the total spend allowed for this key.'
            max_parallel_requests: '- (Optional) Maximum number of parallel requests allowed for this key. This helps in controlling concurrent usage.'
            metadata: '- (Optional) Metadata associated with this key. This can be used to store additional, custom information about the key.'
            model_max_budget: '- (Optional) JSON string of per-model budget config, e.g. jsonencode({"gpt-4" = {budget_limit = 50.0, time_period = "30d"}}). Each model maps to an object with budget_limit (or max_budget), time_period (or budget_duration), tpm_limit and rpm_limit.'
            model_rpm_limit: '- (Optional) Requests per minute limit per model. This allows setting different RPM limits for each model.'
            model_tpm_limit: '- (Optional) Tokens per minute limit per model. This allows setting different TPM limits for each model.'
            models: '- (Optional) List of models that can be used with this key. This restricts the key to only use the specified models.'
            organization_id: '- (Optional) ID of the organization this key belongs to.'
            permissions: '- (Optional) Permissions associated with this key. This defines what actions are allowed with this key.'
            project_id: '- (Optional) ID of the project this key belongs to. Changing this forces a new key to be created.'
            prompts: '- (Optional) List of prompt IDs this key is allowed to use.'
            rpm_limit: '- (Optional) Requests per minute limit for this key. This sets a rate limit based on the number of API calls.'
            rpm_limit_type: '- (Optional) How the RPM limit is enforced. One of guaranteed_throughput, best_effort_throughput or dynamic.'
            server_metadata: '- Map of every metadata entry the proxy stores for this key, including entries not declared in metadata, so drift on them is visible on refresh. Entries already exposed as their own attributes (model_rpm_limit, model_tpm_limit, tags, guardrails, enforced_params, allowed_passthrough_routes, rpm_limit_type, tpm_limit_type, prompts) are omitted and non-string values are JSON encoded. Terraform never writes it; metadata still tracks only the entries declared in the configuration.'
            soft_budget: '- (Optional) Soft budget limit for this key. This can be used to set a warning threshold before reaching the max_budget.'
            spend: '- The current spend for this key. This reflects the total amount spent using this key so far.'
            tags: '- (Optional) List of tags associated with this key. This can be used for organization and filtering of keys.'
            team_id: '- (Optional) Team ID associated with this key. This links the key to a specific team in the LiteLLM system.'
            tpm_limit: '- (Optional) Tokens per minute limit for this key. This sets a rate limit based on the number of tokens processed.'
            tpm_limit_type: '- (Optional) How the TPM limit is enforced. One of guaranteed_throughput, best_effort_throughput or dynamic.'
            user_id: '- (Optional) User ID associated with this key. This links the key to a specific user in the LiteLLM system.'
        importStatements: []
    litellm_key_block:
        subCategory: ""
        name: litellm_key_block
        title: ""
        examples:
            - name: example
              manifest: |-
                {
                  "key": "${litellm_key.example.key}"
                }
              references:
                key: litellm_key.example.key
              dependencies:
                litellm_key.example: |-
                    {
                      "models": [
                        "gpt-4"
                      ]
                    }
        argumentDocs:
            blocked: '- Whether the key is currently blocked. Always true while this resource exists.'
            id: '- The SHA-256 token hash of the key.'
            key: '- (Required, Forces new resource, Sensitive) The API key to block, as the raw sk- value or its SHA-256 token hash. The provider normalizes raw values to the hash before talking to the API, so the plaintext key never appears in request URLs, the resource ID, or plan output.'
        importStatements:
            - terraform import litellm_key_block.example 88362cbb875f4b48b4b5b56b2ea45f66465e27d55a189816bd54e5643e5410eb
    litellm_mcp_server:
        subCategory: ""
        name: litellm_mcp_server
        title: ""
        examples:
            - name: github_server
              manifest: |-
                {
                  "alias": "github",
                  "auth_type": "bearer",
                  "description": "GitHub MCP server for repository operations",
                  "mcp_access_groups": [
                    "dev_team",
                    "devops_team"
                  ],
                  "server_name": "github-mcp-server",
                  "transport": "http",
                  "url": "https://api.github.com/mcp"
                }
            - name: zapier_server
              manifest: |-
                {
                  "alias": "zapier",
                  "auth_type": "bearer",
                  "description": "Zapier MCP server for workflow automation",
                  "mcp_access_groups": [
                    "automation_team",
                    "marketing_team"
                  ],
                  "mcp_info": [
                    {
                      "description": "Provides automation tools through Zapier's MCP interface",
                      "logo_url": "https://zapier.com/assets/images/zapier-logo.png",
                      "mcp_server_cost_info": [
                        {
                          "default_cost_per_query": 0.01,
                          "tool_name_to_cost_per_query": {
                            "create_calendar_event": 0.04,
                            "create_document": 0.03,
                            "post_to_slack": 0.01,
                            "send_email": 0.05,
                            "update_spreadsheet": 0.02
                          }
                        }
                      ],
                      "server_name": "Zapier Integration Server"
                    }
                  ],
                  "server_name": "zapier-automation",
                  "spec_version": "2024-11-05",
                  "transport": "sse",
                  "url": "https://actions.zapier.com/mcp/sk-xxxxx/sse"
                }
            - name: local_dev_server
              manifest: |-
                {
                  "alias": "local-dev",
                  "args": [
                    "/opt/mcp-servers/dev-tools/server.py",
                    "--verbose"
                  ],
                  "auth_type": "none",
                  "command": "python3",
                  "description": "Local MCP server for development tools",
                  "env": {
                    "DEBUG": "true",
                    "LOG_LEVEL": "info",
                    "PYTHONPATH": "/opt/mcp-servers/dev-tools",
                    "WORKSPACE_DIR": "/workspace"
                  },
                  "mcp_access_groups": [
                    "local_developers"
                  ],
                  "mcp_info": [
                    {
                      "description": "Local development utilities and tools",
                      "mcp_server_cost_info": [
                        {
                          "default_cost_per_query": 0
                        }
                      ],
                      "server_name": "Development Tools"
                    }
                  ],
                  "server_name": "local-development-tools",
                  "transport": "stdio",
                  "url": "stdio://local-dev"
                }
            - name: enterprise_api_server
              manifest: |-
                {
                  "alias": "enterprise",
                  "auth_type": "bearer",
                  "description": "Enterprise API gateway MCP server",
                  "mcp_access_groups": [
                    "enterprise_users",
                    "api_consumers",
                    "integration_team"
                  ],
                  "mcp_info": [
                    {
                      "description": "Provides access to enterprise APIs and services",
                      "logo_url": "https://enterprise.com/logo.png",
                      "mcp_server_cost_info": [
                        {
                          "default_cost_per_query": 0.1,
                          "tool_name_to_cost_per_query": {
                            "audit_log_query": 0.3,
                            "create_user": 0.15,
                            "generate_report": 0.5,
                            "query_database": 0.25,
                            "send_notification": 0.05,
                            "update_permissions": 0.2
                          }
                        }
                      ],
                      "server_name": "Enterprise API Gateway"
                    }
                  ],
                  "server_name": "enterprise-api-gateway",
                  "spec_version": "2024-11-05",
                  "transport": "http",
                  "url": "https://api.enterprise.com/mcp/v1"
                }
        argumentDocs:
            alias: '- (Optional) Alias for the MCP server. Used for easier reference.'
            args: '- (Optional) List of arguments for the command (stdio transport only). Do not pass secrets as arguments; args are shown in plans, stored unencrypted in state, and visible in the server''s process list.'
            auth_type: '- (Optional) Authentication type. Valid values: none, bearer, basic. Defaults to none.'
            command: '- (Optional) Command to run for stdio transport.'
            created_at: '- Timestamp when the server was created.'
            created_by: '- User who created the server.'
            description: '- (Optional) Description of the MCP server.'
            env: '- (Optional, Sensitive) Map of environment variables for the command (stdio transport only). Hidden from plan output but still stored unencrypted in state; secure your state backend when configuring tokens here.'
            health_check_error: '- Error message from the last health check, if any.'
            last_health_check: '- Timestamp of the last health check.'
            mcp_access_groups: '- (Optional) List of access groups that can use this MCP server.'
